{{- $img := resources.Get (printf "images/%s" .image) -}}
{{- $w := .width | default 1400 -}}
{{- $png := $img.Resize (printf "%dx q90" $w) -}}
{{- $webp := $img.Resize (printf "%dx webp q85" $w) -}}
<figure class="figure{{ with .class }} {{ . }}{{ end }}"><div class="figure__frame figure__frame--bar{{ if .detail }} figure__frame--detail{{ end }}">{{ if .detail }}<a href="{{ $img.RelPermalink }}" aria-label="Open full screenshot" data-lightbox data-alt="{{ .alt }}" data-caption="{{ .caption }}">{{ end }}<picture><source type="image/webp" srcset="{{ $webp.RelPermalink }}"><img src="{{ $png.RelPermalink }}" width="{{ $png.Width }}" height="{{ $png.Height }}" alt="{{ .alt }}"></picture>{{ if .detail }}</a>{{ end }}</div>{{ with .caption }}<figcaption class="caption">{{ . }}{{ if $.detail }} <a class="figure__expand" href="{{ $img.RelPermalink }}" data-lightbox data-alt="{{ $.alt }}" data-caption="{{ $.caption }}">View full screenshot ↗</a>{{ end }}</figcaption>{{ end }}</figure>
