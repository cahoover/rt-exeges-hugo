{{ define "main" }}
<section class="post-list">
  <div class="wrap">
    <header class="post-list__head"><h1>{{ .Title }}</h1>{{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}<p class="meta">Filter by <a href="/tags/">tag</a></p></header>
    {{ partial "post-cards.html" (.Paginate .Pages) }}
    {{ partial "pagination.html" . }}
  </div>
</section>
{{ end }}
