#plate-gate .labB{transform:translateX(40px);opacity:1}
#plate-gate .lineA{stroke:#2A7A4B}
#plate-gate .lineB{stroke:#A33A3A;opacity:0}
#plate-gate .badgeA{opacity:1}
#plate-gate .stampB{opacity:1}
</style>
