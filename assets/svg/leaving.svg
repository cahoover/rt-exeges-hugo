<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="lv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent, #2b4fb8)"/></marker>
  </defs>
  <!-- ground -->
  <path d="M10 330H550" stroke="var(--rule-strong, #b9b1a0)" stroke-width="1.2"/>
  <!-- building -->
  <rect x="30" y="60" width="220" height="270" fill="#fff" stroke="var(--ink, #16191f)" stroke-width="1.4"/>
  <path d="M30 60 L140 24 L250 60" fill="var(--paper-2, #efeadf)" stroke="var(--ink, #16191f)" stroke-width="1.4" stroke-linejoin="round"/>
  <g fill="var(--paper-2, #efeadf)" stroke="var(--rule-strong, #b9b1a0)" stroke-width="1.2">
    <rect x="54" y="86" width="34" height="40"/><rect x="104" y="86" width="34" height="40"/><rect x="154" y="86" width="34" height="40"/><rect x="204" y="86" width="30" height="40"/>
    <rect x="54" y="150" width="34" height="40"/><rect x="104" y="150" width="34" height="40"/><rect x="154" y="150" width="34" height="40"/><rect x="204" y="150" width="30" height="40"/>
    <rect x="54" y="214" width="34" height="40"/><rect x="104" y="214" width="34" height="40"/>
  </g>
  <!-- door, open -->
  <rect x="176" y="236" width="56" height="94" fill="var(--ink, #16191f)"/>
  <path d="M232 236 L262 226 L262 330 L232 330 Z" fill="var(--paper-3, #e7e1d3)" stroke="var(--ink, #16191f)" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="140" y="306" text-anchor="middle" class="t-label">your team</text>
  <!-- the record, leaving -->
  <g transform="translate(286 196)">
    <rect x="8" y="10" width="96" height="124" rx="3" fill="var(--paper-2, #efeadf)" stroke="var(--rule-strong, #b9b1a0)" stroke-width="1.2"/>
    <rect x="4" y="5" width="96" height="124" rx="3" fill="var(--paper-2, #efeadf)" stroke="var(--rule-strong, #b9b1a0)" stroke-width="1.2"/>
    <rect x="0" y="0" width="96" height="124" rx="3" fill="#fff" stroke="var(--ink, #16191f)" stroke-width="1.4"/>
    <g stroke-linecap="round" stroke-width="2">
      <rect x="12" y="16" width="6" height="6" fill="var(--accent, #2b4fb8)"/><path d="M24 19h56" stroke="var(--ink-2, #434954)"/>
      <rect x="12" y="36" width="6" height="6" fill="var(--accent, #2b4fb8)"/><path d="M24 39h44" stroke="var(--ink-2, #434954)"/>
      <rect x="12" y="56" width="6" height="6" fill="var(--accent, #2b4fb8)"/><path d="M24 59h60" stroke="var(--ink-2, #434954)"/>
      <path d="M12 79h66" stroke="var(--rule-strong, #b9b1a0)"/><path d="M12 95h50" stroke="var(--rule-strong, #b9b1a0)"/>
    </g>
    <circle cx="74" cy="100" r="13" fill="var(--paper, #f7f4ec)" stroke="var(--ok, #2f7a4f)" stroke-width="1.6"/>
    <path d="M68 100l4 4 8-9" fill="none" stroke="var(--ok, #2f7a4f)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="340" y="346" text-anchor="middle" class="t-label">the record, as ordinary files</text>
  <!-- paths to the other parties -->
  <g fill="none" stroke="var(--accent, #2b4fb8)" stroke-width="1.4" marker-end="url(#lv-arrow)">
    <path d="M390 230 C 420 230, 420 92, 448 92"/>
    <path d="M390 250 C 420 250, 420 172, 448 172"/>
    <path d="M390 270 C 420 270, 420 252, 448 252"/>
  </g>
  <g fill="#fff" stroke="var(--ink, #16191f)" stroke-width="1.4">
    <rect x="452" y="68" width="88" height="48" rx="3"/>
    <rect x="452" y="148" width="88" height="48" rx="3"/>
    <rect x="452" y="228" width="88" height="48" rx="3"/>
  </g>
  <g class="t-strong" text-anchor="middle">
    <text x="496" y="97">a client</text>
    <text x="496" y="177">a successor</text>
    <text x="496" y="257">a regulator</text>
  </g>
  <text x="496" y="306" text-anchor="middle" class="t-label">inspect, and record</text>
  <text x="496" y="320" text-anchor="middle" class="t-label">their own acceptance</text>
</svg>
